name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-pre[0-9]+']
    paths-ignore: [ 'docs/**' ]

permissions: write-all

env:
  CONFIG: Release
  SLN_FILE: Fabulous.AST.slnx
  JSON_FILE: extensions/Fabulous.AST.Json/Fabulous.AST.Json.fsproj
  BUILD_FILE: extensions/Fabulous.AST.Build/Fabulous.AST.Build.fsproj

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Extract version from tag
        uses: damienaicheh/extract-version-from-tag-action@v1.0.0
      - name: Set release version
        run: |
          if [ "${PRE_RELEASE}" == "" ]; then
            RELEASE_VERSION=${MAJOR}.${MINOR}.${PATCH}
          else
            RELEASE_VERSION=${MAJOR}.${MINOR}.${PATCH}-${PRE_RELEASE}
          fi
          echo "Release version is $RELEASE_VERSION"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          version: '${{ env.RELEASE_VERSION }}'
          path: ./CHANGELOG.md
      - name: Get Fabulous.AST.Json Changelog Entry
        id: json_changelog
        uses: mindsers/changelog-reader-action@v2
        with:
            validation_level: warn
            version: '${{ env.RELEASE_VERSION }}'
            path: extensions/Fabulous.AST.Json/CHANGELOG.md
      - name: Get Fabulous.AST.Build Changelog Entry
        id: build_changelog
        uses: mindsers/changelog-reader-action@v2
        with:
            validation_level: warn
            version: '${{ env.RELEASE_VERSION }}'
            path: extensions/Fabulous.AST.Build/CHANGELOG.md
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Restore
        run: dotnet restore ${SLN_FILE}
      # Fabulous.AST.Build ships an MSBuild task that samples/Playground consumes
      # via <UsingTask> in Fabulous.AST.Build.targets. UsingTask conditions are
      # evaluated at project-load time, so the task DLL must exist on disk before
      # we build anything that imports those targets. build.fsx already handles
      # this; the release workflow must too.
      - name: Pre-build Fabulous.AST.Build
        run: dotnet build ${BUILD_FILE} -p:Version=${RELEASE_VERSION} -c ${CONFIG} --no-restore
      - name: Build
        run: dotnet build ${SLN_FILE} -p:Version=${RELEASE_VERSION} -c ${CONFIG} --no-restore
      - name: Test
        run: dotnet test ${SLN_FILE} -p:Version=${RELEASE_VERSION} -c ${CONFIG} --no-build
      - name: Pack
        # Release notes are sourced via env vars that Directory.Build.props
        # picks up as MSBuild properties (auto-imported). This avoids the
        # fragility of `-p:PackageReleaseNotes="..."` on the command line,
        # which has to navigate shell quoting (backticks → command
        # substitution), MSBuild `;` property delimiters, `/` switch prefixes,
        # and embedded newlines. By the time MSBuild evaluates
        # $(RELEASE_NOTES) inside Directory.Build.props, the value is an
        # opaque string from the environment with no parser between us and it.
        env:
          RELEASE_NOTES: ${{ steps.changelog_reader.outputs.changes }}
          JSON_RELEASE_NOTES: ${{ steps.json_changelog.outputs.changes }}
          BUILD_RELEASE_NOTES: ${{ steps.build_changelog.outputs.changes }}
        run: |
          dotnet pack ${SLN_FILE} -p:Version=${RELEASE_VERSION} -c ${CONFIG} --property PackageOutputPath=${PWD}/nupkgs
          dotnet pack ${JSON_FILE} -p:Version=${RELEASE_VERSION} -c ${CONFIG} --property PackageOutputPath=${PWD}/nupkgs
          dotnet pack ${BUILD_FILE} -p:Version=${RELEASE_VERSION} -c ${CONFIG} --property PackageOutputPath=${PWD}/nupkgs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Packages
          path: nupkgs/
      - name: Push
        run: dotnet nuget push "nupkgs/*" -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_TOKEN }} --skip-duplicate
